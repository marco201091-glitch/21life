License: MIT
AuthorName: blackistoostrong
WebSite: https://21life.win
SourceCode: https://github.com/marco201091-glitch/21life
IssueTracker: https://github.com/marco201091-glitch/21life/issues
Changelog: https://github.com/marco201091-glitch/21life/releases

AutoName: 21Life
Description: |-
  Track Commander games without spreadsheets.

  Features:

  * realtime life, commander damage, infect, eliminations, and match finalization
  * playgroup history with players, decks, commanders, rankings, and awards
  * deck import from Archidekt and Moxfield
  * optional public playgroup pages for rankings and color trends
  * offline recovery for active live games
  * Italian and English interface

  This app is unofficial fan content. It is not affiliated with, endorsed by, or
  sponsored by Wizards of the Coast, Scryfall, EDHREC, Archidekt, Moxfield, or
  other mentioned services.

RepoType: git
Repo: https://github.com/marco201091-glitch/21life.git

Builds:
  - versionName: 8.0.0
    versionCode: 80000
    commit: REPLACE_WITH_FDROID_RELEASE_COMMIT_SHA
    timeout: 7200
    subdir: expo
    sudo:
      - apt-get update
      - apt-get install -y ca-certificates curl
      - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get install -y nodejs
    init:
      - cd .. && npm ci
      - cd expo && npm ci
      - node scripts/patch-fdroid-java-toolchains.mjs
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - export APP_VARIANT=fdroid
      - export EXPO_PUBLIC_FDROID_BUILD=true
      - export EXPO_PUBLIC_SENTRY_ENABLED=false
      - export EXPO_PUBLIC_DISABLE_PUSH_NOTIFICATIONS=true
      - npx --no-install expo prebuild --platform android --clean --no-install
      - cd ..
      - npm run verify:fdroid
      - cd expo
      - npm run typecheck
    scanignore:
      - node_modules
      - expo/node_modules
    build:
      - export APP_VARIANT=fdroid
      - export EXPO_PUBLIC_FDROID_BUILD=true
      - export EXPO_PUBLIC_SENTRY_ENABLED=false
      - export EXPO_PUBLIC_DISABLE_PUSH_NOTIFICATIONS=true
      - cd android
      - gradle :app:assembleRelease -PfdroidBuild=true -PreactNativeArchitectures=arm64-v8a
        --no-daemon --console=plain

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 8.0.0
CurrentVersionCode: 80000
