Builds:
  - versionName: 8.2.0
    versionCode: 80200
    commit: 59b596315e035f7dd5e7715a9f48004a3d52cc0f
    subdir: expo
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - cd ..
      - npm ci
      - cd expo
      - npm ci
      - node scripts/patch-fdroid-java-toolchains.mjs
      - node scripts/patch-fdroid-reproducibility.mjs
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - export APP_VARIANT=fdroid
      - export EXPO_PUBLIC_FDROID_BUILD=true
      - export EXPO_PUBLIC_SENTRY_ENABLED=false
      - export EXPO_PUBLIC_DISABLE_PUSH_NOTIFICATIONS=true
      - npx --no-install expo prebuild --platform android --clean --no-install
      - sed -i 's/-Xmx2048m/-Xmx4g/' android/gradle.properties
      - sed -i 's/MaxMetaspaceSize=512m/MaxMetaspaceSize=1g/' android/gradle.properties
      - echo 'org.gradle.workers.max=1' >> android/gradle.properties
      - cd ..
      - npm run verify:fdroid
      - cd expo
      - npm run typecheck
    scanignore:
      - expo/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - expo/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - expo/node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - expo/node_modules/@react-native-community/netinfo/android/build.gradle
      - expo/node_modules/@react-native-masked-view/masked-view/android/build.gradle
      - expo/node_modules/react-native-get-random-values/android/build.gradle
      - expo/node_modules/react-native-keyboard-controller/android/build.gradle
      - expo/node_modules/react-native-safe-area-context/android/build.gradle
      - expo/node_modules/react-native-screens/android/build.gradle
      - expo/node_modules/react-native-svg/android/build.gradle
      - expo/node_modules/react-native-view-shot/android/build.gradle
      - expo/node_modules/react-native-webview/android/build.gradle
      - expo/node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - node_modules
      - expo/node_modules
    build:
      - export APP_VARIANT=fdroid
      - export EXPO_PUBLIC_FDROID_BUILD=true
      - export EXPO_PUBLIC_SENTRY_ENABLED=false
      - export EXPO_PUBLIC_DISABLE_PUSH_NOTIFICATIONS=true
      - cd android
      - gradle :app:assembleRelease -PfdroidBuild=true -PreactNativeArchitectures=arm64-v8a
        -PreactNativeDevServerIp=localhost --no-daemon --console=plain

