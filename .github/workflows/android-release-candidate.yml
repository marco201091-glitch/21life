name: Android release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to build
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            if (-not $env:GITHUB_REF_NAME.StartsWith("v")) { throw "Release tag must start with v" }
            $version = $env:GITHUB_REF_NAME.Substring(1)

            $remoteTagRefs = (git ls-remote --tags origin "refs/tags/$env:GITHUB_REF_NAME*") -join "`n"
            if ($remoteTagRefs -notmatch '\^\{\}') {
              throw "Release tag must be annotated"
            }

            git fetch origin main --no-tags
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw "Release tag is not based on main" }
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must use SemVer (X.Y.Z)" }
          $appVersion = (Get-Content -Raw "expo/app.json" | ConvertFrom-Json).expo.version
          if ($appVersion -ne $version) {
            throw "Tag/input version $version does not match expo/app.json version $appVersion"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: expo
        run: npm ci

      - name: Install web dependencies
        run: npm ci

      - name: Full automated release gate
        run: |
          npm run quality
          npm --prefix expo run quality
          npm run verify:obtainium -- --release

      - name: Build verified signed APK
        shell: pwsh
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_MOBILE_PROJECT: ${{ secrets.SENTRY_MOBILE_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if (-not $env:RELEASE_KEYSTORE_BASE64) { throw "Missing release keystore secret" }
          if (-not $env:SENTRY_AUTH_TOKEN -or -not $env:SENTRY_ORG -or -not $env:SENTRY_MOBILE_PROJECT -or -not $env:SENTRY_DSN) {
            throw "Missing Sentry release configuration"
          }
          $turnstile = Invoke-RestMethod -Uri "https://app.phyrexianarena.dpdns.org/api/auth/turnstile/config" -TimeoutSec 15
          if (-not $turnstile.siteKey) { throw "Production Turnstile site key is unavailable" }
          $keystorePath = Join-Path $env:RUNNER_TEMP "phyrexian-arena-release.jks"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:RELEASE_KEYSTORE_BASE64))
          $gradleKeystorePath = $keystorePath -replace '\\', '/'

          $signingPath = Join-Path $env:RUNNER_TEMP "android-signing.properties"
          @(
            "storeFile=$gradleKeystorePath"
            "storePassword=$env:RELEASE_STORE_PASSWORD"
            "keyAlias=$env:RELEASE_KEY_ALIAS"
            "keyPassword=$env:RELEASE_KEY_PASSWORD"
          ) | Set-Content -LiteralPath $signingPath

          @(
            "EXPO_PUBLIC_SUPABASE_URL=https://phyrexianarena.dpdns.org"
            "EXPO_PUBLIC_SUPABASE_ANON_KEY=$env:PRODUCTION_SUPABASE_ANON_KEY"
            "EXPO_PUBLIC_API_BASE_URL=https://app.phyrexianarena.dpdns.org"
            "EXPO_PUBLIC_SITE_URL=https://app.phyrexianarena.dpdns.org"
            "EXPO_PUBLIC_TURNSTILE_SITE_KEY=$($turnstile.siteKey)"
            "EXPO_PUBLIC_SUPPORT_EMAIL=support@phyrexianarena.dpdns.org"
            "EXPO_PUBLIC_SENTRY_ENABLED=true"
            "EXPO_PUBLIC_SENTRY_DSN=$env:SENTRY_DSN"
          ) | Set-Content -LiteralPath "expo/.env.production.local"

          $env:PHYREXIAN_SIGNING_PROPERTIES = $signingPath
          cmd /c "scripts\build-apk-production.bat ${{ steps.release.outputs.version }} --no-pause"
          if ($LASTEXITCODE -ne 0) { throw "Android release candidate build failed" }

      - name: Generate release SBOMs
        shell: pwsh
        run: |
          npm sbom --sbom-format cyclonedx | Set-Content -LiteralPath "artifacts/apk/web-sbom-${{ steps.release.outputs.version }}.json" -Encoding utf8
          npm --prefix expo sbom --sbom-format cyclonedx | Set-Content -LiteralPath "artifacts/apk/android-sbom-${{ steps.release.outputs.version }}.json" -Encoding utf8

      - name: Upload private release candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mtg-tracker-analytics-${{ steps.release.outputs.version }}
          path: |
            artifacts/apk/21life-v${{ steps.release.outputs.version }}.apk
            artifacts/apk/21life-v${{ steps.release.outputs.version }}.apk.sha256
            artifacts/apk/web-sbom-${{ steps.release.outputs.version }}.json
            artifacts/apk/android-sbom-${{ steps.release.outputs.version }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish and verify GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/release/publish-github-release.mjs
