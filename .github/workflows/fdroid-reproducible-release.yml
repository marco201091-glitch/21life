name: F-Droid reproducible reference APK

on:
  push:
    tags:
      - 'fdroid-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      APP_VARIANT: fdroid
      EXPO_PUBLIC_FDROID_BUILD: 'true'
      EXPO_PUBLIC_SENTRY_ENABLED: 'false'
      EXPO_PUBLIC_DISABLE_PUSH_NOTIFICATIONS: 'true'
      GRADLE_USER_HOME: /home/vagrant/.gradle
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate F-Droid tag and release configuration
        id: release
        run: |
          version="${GITHUB_REF_NAME#fdroid-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(node -p "require('./expo/app.json').expo.version")" == "$version" ]]
          for secret in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [[ -n "${!secret}" ]] || { echo "Missing $secret"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./expo/app.json').expo.android.versionCode")" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Match Debian Forky npm
        run: npm install --global npm@9.2.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build-tools 34
        run: sdkmanager 'build-tools;34.0.0'

      - name: Mirror the F-Droid SDK and build paths
        run: |
          test ! -e /opt/android-sdk
          sudo mv "$ANDROID_HOME" /opt/android-sdk
          sudo chown -R "$(id -u):$(id -g)" /opt/android-sdk
          echo 'ANDROID_HOME=/opt/android-sdk' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=/opt/android-sdk' >> "$GITHUB_ENV"
          sudo install -d -o "$(id -u)" -g "$(id -g)" /home/vagrant/build/com.phyrexianarena.app
          sudo install -d -o "$(id -u)" -g "$(id -g)" /home/vagrant/.gradle
          cp -a "$GITHUB_WORKSPACE/." /home/vagrant/build/com.phyrexianarena.app/

      - name: Install dependencies
        working-directory: /home/vagrant/build/com.phyrexianarena.app
        run: |
          npm ci
          npm --prefix expo ci
          node --test scripts/prepare-fdroid-env.test.mjs
          node scripts/prepare-fdroid-env.mjs

      - name: Validate the F-Droid source tree
        working-directory: /home/vagrant/build/com.phyrexianarena.app
        run: |
          npm run verify:fdroid
          npm --prefix expo run typecheck

      - name: Apply the F-Droid build patches
        working-directory: /home/vagrant/build/com.phyrexianarena.app/expo
        run: |
          node scripts/patch-fdroid-java-toolchains.mjs
          node scripts/patch-fdroid-reproducibility.mjs

      - name: Generate F-Droid Android project
        working-directory: /home/vagrant/build/com.phyrexianarena.app/expo
        run: npx --no-install expo prebuild --platform android --clean --no-install

      - name: Constrain Gradle memory and workers
        working-directory: /home/vagrant/build/com.phyrexianarena.app/expo
        run: |
          sed -i 's/-Xmx2048m/-Xmx4g/; s/MaxMetaspaceSize=512m/MaxMetaspaceSize=1g/' android/gradle.properties
          printf '\norg.gradle.workers.max=1\n' >> android/gradle.properties

      - name: Verify Expo autolinking and scan the source tree
        working-directory: /home/vagrant/build/com.phyrexianarena.app
        run: |
          node scripts/verify-fdroid-autolinking.mjs
          python3 -m venv "$RUNNER_TEMP/fdroid-tools"
          "$RUNNER_TEMP/fdroid-tools/bin/pip" install 'fdroidserver==2.4.5'
          "$RUNNER_TEMP/fdroid-tools/bin/python" scripts/scan-fdroid-source.py --build-dir "$PWD"
          node scripts/verify-fdroid-autolinking.mjs

      - name: Build twice and compare unsigned APKs
        working-directory: /home/vagrant/build/com.phyrexianarena.app/expo/android
        run: |
          gradle :app:assembleRelease -PfdroidBuild=true -PreactNativeArchitectures=arm64-v8a -PreactNativeDevServerIp=localhost --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/fdroid-first.apk"
          gradle clean --no-daemon --console=plain
          gradle :app:assembleRelease -PfdroidBuild=true -PreactNativeArchitectures=arm64-v8a -PreactNativeDevServerIp=localhost --no-daemon --console=plain
          cmp "$RUNNER_TEMP/fdroid-first.apk" app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK identity, architecture and permissions
        working-directory: /home/vagrant/build/com.phyrexianarena.app/expo/android
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/fdroid-badging.txt"
          grep -F "package: name='com.phyrexianarena.app' versionCode='${{ steps.release.outputs.code }}' versionName='${{ steps.release.outputs.version }}'" "$RUNNER_TEMP/fdroid-badging.txt"
          grep -Fx "application-label:'21Life'" "$RUNNER_TEMP/fdroid-badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/fdroid-badging.txt"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$apk" > "$RUNNER_TEMP/fdroid-permissions.txt"
          if grep -E 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_|REQUEST_INSTALL_PACKAGES|POST_NOTIFICATIONS|com.google.android.c2dm' "$RUNNER_TEMP/fdroid-permissions.txt"; then
            echo 'Unexpected permission in F-Droid APK'
            exit 1
          fi

      - name: Sign and verify the reproducible reference APK
        id: apk
        working-directory: /home/vagrant/build/com.phyrexianarena.app/expo/android
        run: |
          keystore="$RUNNER_TEMP/phyrexian-arena-release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unsigned='app/build/outputs/apk/release/app-release-unsigned.apk'
          aligned="$RUNNER_TEMP/fdroid-aligned.apk"
          output="$RUNNER_TEMP/mtg-tracker-fdroid-v${{ steps.release.outputs.version }}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$keystore" --ks-pass "pass:$RELEASE_STORE_PASSWORD" --ks-key-alias "$RELEASE_KEY_ALIAS" --key-pass "pass:$RELEASE_KEY_PASSWORD" --out "$output" "$aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$output" | tee "$RUNNER_TEMP/fdroid-cert.txt"
          expected=$(sed -n 's/^AllowedAPKSigningKeys: //p' ../../fdroid/metadata/com.phyrexianarena.app.yml)
          grep -F "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/fdroid-cert.txt"
          "$RUNNER_TEMP/fdroid-tools/bin/fdroid" scanner --refresh --exit-code "$output"
          echo "apk=$output" >> "$GITHUB_OUTPUT"

      - name: Publish reference APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "$(basename "$APK")" > "$APK.sha256"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "F-Droid reference $GITHUB_REF_NAME" \
            --notes 'Developer-signed reference APK for F-Droid reproducible-build verification.'
