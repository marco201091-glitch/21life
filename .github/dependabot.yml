version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: Dev
    # Match the supported runtime; upgrade Node and its types together.
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      web-patch-and-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /expo
    schedule:
      interval: weekly
    target-branch: Dev
    # Native majors must follow an Expo SDK compatibility upgrade.
    ignore:
      - dependency-name: react-native-gesture-handler
        update-types: ['version-update:semver-major']
      - dependency-name: react-native-view-shot
        update-types: ['version-update:semver-major']
    groups:
      expo-patch-and-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: Dev
    groups:
      codeql:
        patterns: ['github/codeql-action*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: Dev
